---
layout: default
---
<article class="page">
  <header class="rail entry-head entry-head--page">
    {%- if page.kicker -%}<p class="label">{{ page.kicker }}</p>{%- endif -%}
    <h1 class="display">{% include title.html t=page.title %}</h1>
    {%- if page.lede -%}<p class="entry-lede">{{ page.lede }}</p>{%- endif -%}
  </header>
  <div class="rail entry-grid entry-grid--page">
    <div class="entry-aside" aria-hidden="true">
      {%- if page.portrait -%}<img class="page-portrait" src="{{ page.portrait }}" alt="" loading="lazy">{%- endif -%}
    </div>
    <div class="prose">{{ content }}</div>
  </div>
</article>
