# Builds the journal and commits the finished pages.
#
#  Source:  journal-src/   (Jekyll: _config.yml, _layouts, _sass, en/, es/, pt/, ru/ …)
#  Output:  journal/       (plain HTML, committed by this workflow)
#
# GitHub Pages keeps deploying from the branch as before (".nojekyll", no
# Jekyll build). It simply publishes journal/ like any other folder, so no
# Pages setting has to change.
#
# Pull requests: build + smoke test only, nothing is committed.
# Pushes to main: build, test, then commit journal/ if anything changed.

name: Build journal

on:
  push:
    branches: [main]
    paths:
      - "journal-src/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "journal-src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: journal-src

      - name: Build journal
        working-directory: journal-src
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination ../journal

      - name: Smoke-test journal
        run: |
          set -e
          for l in en es pt ru; do
            # An empty journal has no articles directory (git does not keep it).
            if [ -d "journal-src/$l/articles" ]; then
              n=$(find "journal-src/$l/articles" -maxdepth 1 -type f -name '*.md' | wc -l)
            else
              n=0
            fi
            n=$((n))
            rows=$(grep -o 'class="row"' journal/$l/index.html | wc -l)
            rows=$((rows))
            echo "$l: $n articles, $rows rows on the index"
            grep -qi '<!doctype html>' journal/$l/index.html || { echo "::error::$l index is not rendered HTML"; exit 1; }
            if grep -q '{%' journal/$l/index.html; then echo "::error::$l index contains raw Liquid"; exit 1; fi
            # Homes always list the four locales. This does not depend on articles.
            for h in en es pt-BR ru; do
              grep -q "hreflang=\"$h\"" journal/$l/index.html || { echo "::error::$l index missing hreflang $h"; exit 1; }
            done
            # The index lists exactly the articles that exist. Zero is a valid count.
            [ "$rows" -eq "$n" ] || { echo "::error::$l index lists $rows of $n articles"; exit 1; }
            # Atom feed stays valid with no entries, and lists them once articles exist.
            grep -q '<feed' journal/$l/feed.xml || { echo "::error::$l feed is not Atom"; exit 1; }
            entries=$(grep -c '<entry>' journal/$l/feed.xml || true)
            entries=$((entries))
            if [ "$n" -gt 0 ]; then
              [ "$entries" -gt 0 ] || { echo "::error::empty $l feed"; exit 1; }
            else
              [ "$entries" -eq 0 ] || { echo "::error::$l feed has entries but no articles"; exit 1; }
            fi
          done
          test -s journal/assets/css/journal.css
          missing=$(grep -L "gtag('config', 'G-" $(find journal -name '*.html' ! -path 'journal/index.html') || true)
          [ -z "$missing" ] || { echo "::error::Google tag missing from: $missing"; exit 1; }
          echo "Built pages:" && find journal -name '*.html' | sort

      - name: Commit built journal
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A journal
          if git diff --cached --quiet; then
            echo "journal/ is already up to date."
            exit 0
          fi
          git commit -m "Build journal from ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
