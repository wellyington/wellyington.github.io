<style>
body{margin:0;background:#FDFCDC;color:#0B2E3A;}
body:has(.dk){background:#08202A}
body{font-family:'Jost',system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;min-width:0}
a{color:var(--ink);text-decoration:none}a:hover{color:var(--teal-text)}
.th{--bg:#FDFCDC;--bg-rgb:253,252,220;--ink:#0B2E3A;--ink-rgb:11,46,58;--muted:#2F4A53;--muted2:#4A6169;--card:#FFFEF0;--peach:#FED9B7;--line:#D9D5B0;--soft:#E9E6C6;--teal:#0081A7;--teal-text:#00708F;--fill:#0B2E3A;--on-fill:#FDFCDC;--deep:#0B2E3A;color-scheme:light}
.th.dk{--bg:#08202A;--bg-rgb:8,32,42;--ink:#F4F1D8;--ink-rgb:244,241,216;--muted:#C3D3D0;--muted2:#A3B9B6;--card:#0F2E3A;--peach:#123441;--line:#2C4B55;--soft:#173843;--teal:#00AFB9;--teal-text:#45C9D1;--fill:#FDFCDC;--on-fill:#0B2E3A;--deep:#04151B;color-scheme:dark}
:where(.th,.th section,.th header,.th footer,.th div,.th a,.th p,.th span,.th h1,.th h2,.th h3,.th button,.th input,.th li){transition:background-color .6s ease,color .6s ease,border-color .6s ease}
.dk .logo-l{display:none !important}.dk .logo-d{display:block !important}
.dk .heroimg img{mix-blend-mode:normal !important;opacity:.5 !important}
.dk input::placeholder{color:#8FA6A3}
.themebtn{transition:transform .5s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s}
.themebtn:hover{transform:rotate(-20deg) scale(1.06);border-color:#F07167 !important}
.ticon{animation:ticon .6s cubic-bezier(.2,.8,.2,1)}
@keyframes ticon{from{opacity:0;transform:rotate(-90deg) scale(.5)}to{opacity:1;transform:none}}
.w{font-family:'Bodoni Moda',Didot,'Times New Roman',serif;font-optical-sizing:auto}
.n{font-stretch:75%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.navlinks{display:flex}.menubtn{display:none}.navcta{display:inline-flex}
.hl{position:relative}
.hl::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:1px;background:#F07167;transform:scaleX(0);transform-origin:right;transition:transform .45s cubic-bezier(.7,0,.2,1)}
.hl:hover::after{transform:scaleX(1);transform-origin:left}
.pill{transition:transform .5s cubic-bezier(.2,.8,.2,1),background .3s,color .3s}
.pill:hover{transform:scale(1.06)}
.pill:hover .pa{transform:rotate(-45deg)}
.pa{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.line{display:block;overflow:hidden}
.line>span{display:inline-block;transform:translateY(105%);animation:up 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.l2>span{animation-delay:.12s}.l3>span{animation-delay:.24s}
@keyframes up{to{transform:none}}
.fade{opacity:0;animation:fade 1s ease .6s forwards}
@keyframes fade{to{opacity:1}}
.stage{transition:background-color .8s cubic-bezier(.7,0,.2,1),color .8s}
.swap{animation:swap .9s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.kb{animation:kb 9s ease-out forwards}
.drift{animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1.5%)}}
.heroimg{animation:heroin 1.8s ease .1s both}
@keyframes heroin{from{opacity:0}to{opacity:1}}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.card-img{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.pvw:hover .card-img{transform:scale(1.04)}
.prog{position:absolute;left:0;bottom:0;height:2px;width:0;background:currentColor;animation:prog 6s linear forwards}
@keyframes prog{to{width:100%}}
.rtab{transition:opacity .3s}
.rtab:hover{opacity:1 !important}
.spin{animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{transition:padding .5s cubic-bezier(.2,.8,.2,1),color .3s}
.row:hover{padding-left:20px !important;color:var(--teal-text)}
.row:hover .ra{transform:rotate(-45deg);background:#F07167;color:#0B2E3A;border-color:#F07167}
.ra{transition:transform .45s,background .3s,color .3s,border-color .3s}
.chip{transition:background .25s,color .25s,border-color .25s,transform .25s}
.chip:hover{transform:translateY(-2px)}
.mood{transition:background-color .8s cubic-bezier(.7,0,.2,1),color .8s}
.sw{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.sw:hover{transform:translateY(-8px)}
.acc{transition:background .3s}
.acc:hover{background:rgba(253,252,220,.08)}
.ba-range{-webkit-appearance:none;appearance:none;position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;z-index:5}
.ba-range:focus-visible + .ba-focus{outline:3px solid #fff;outline-offset:-6px}
html,body{overflow-x:clip;max-width:100%}
img{max-width:100%}
html{scroll-behavior:smooth;scroll-padding-top:84px}
section[id]{scroll-margin-top:84px}
.totop{transition:background .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.totop:hover{background:#F07167 !important;color:#0B2E3A !important;transform:translateY(-4px)}
@media (prefers-reduced-motion:no-preference){
@supports (animation-timeline: view()){
.progress{animation:prog-grow linear both;animation-timeline:scroll(root)}
@keyframes prog-grow{to{transform:scaleX(1)}}
.hdr{animation:hdr-shrink linear both;animation-timeline:scroll(root);animation-range:0 160px}
@keyframes hdr-shrink{to{background:rgba(var(--bg-rgb),0.97);box-shadow:0 10px 30px -18px rgba(0,0,0,0.35)}}
.hdr .logo img{animation:logo-shrink linear both;animation-timeline:scroll(root);animation-range:0 160px}
@keyframes logo-shrink{to{height:38px}}
.totop{animation:totop-in linear both;animation-timeline:scroll(root);animation-range:500px 700px}
@keyframes totop-in{from{opacity:0;visibility:hidden;transform:translateY(16px) scale(.85)}to{opacity:1;visibility:visible;transform:none}}
.heroimg .drift{animation:none}
.heroimg{animation:hero-par linear both !important;animation-timeline:scroll(root) !important;animation-range:0 700px !important}
@keyframes hero-par{to{transform:translateY(90px);opacity:.25}}
#top h1{animation:h1-par linear both;animation-timeline:scroll(root);animation-range:0 700px}
@keyframes h1-par{to{transform:translateY(-40px)}}
.par{animation:par-move linear both;animation-timeline:view();animation-range:cover}
@keyframes par-move{from{transform:translateY(-6%)}to{transform:translateY(6%)}}
section:not(#top) h2{animation:rv-up linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
section:not(#top) h2 + p, #studio p, #clients p{animation:rv-up linear both;animation-timeline:view();animation-range:entry 0% cover 24%}
@keyframes rv-up{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
#work li{animation:rv-row linear both;animation-timeline:view();animation-range:entry 0% cover 22%}
@keyframes rv-row{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
#services .acc, #brief fieldset, #clients [role=tablist]{animation:rv-up linear both;animation-timeline:view();animation-range:entry 0% cover 25%}
.rvimg{animation:rv-clip linear both;animation-timeline:view();animation-range:entry 0% cover 40%}
@keyframes rv-clip{from{clip-path:inset(14% 10% 14% 10% round 40px);transform:scale(.96)}to{clip-path:inset(0 0 0 0 round 0px);transform:none}}
.zwrap img{animation:z-in linear both;animation-timeline:view();animation-range:entry 0% exit 100%}
@keyframes z-in{from{transform:scale(1.22)}to{transform:scale(1)}}
.rvscale{animation:rv-scale linear both;animation-timeline:view();animation-range:entry 0% cover 35%}
@keyframes rv-scale{from{transform:scale(.9);border-radius:80px}to{transform:none;border-radius:28px}}
#studio .badge{animation:badge-par linear both;animation-timeline:view();animation-range:cover}
@keyframes badge-par{from{transform:translateY(60px)}to{transform:translateY(-60px)}}
footer img{animation:rv-up linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
}
@supports not (animation-timeline: view()){
.totop{opacity:1 !important;visibility:visible !important}
}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.totop{opacity:1 !important;visibility:visible !important}}
.pvw{display:block}
.rthumb{display:none !important}
.mnav{animation:mnavIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes mnavIn{from{opacity:0;clip-path:circle(0% at calc(100% - 44px) 40px)}to{opacity:1;clip-path:circle(150% at calc(100% - 44px) 40px)}}
.mi{opacity:0;transform:translateY(18px);animation:miup .7s cubic-bezier(.2,.8,.2,1) forwards}
.mi:nth-child(1){animation-delay:.12s}.mi:nth-child(2){animation-delay:.17s}.mi:nth-child(3){animation-delay:.22s}.mi:nth-child(4){animation-delay:.27s}.mi:nth-child(5){animation-delay:.32s}.mi:nth-child(6){animation-delay:.37s}
.mnav>.mi{animation-delay:.42s}
@keyframes miup{to{opacity:1;transform:none}}
@media (min-width:901px){.mnav{display:none !important}}
.acc>span:last-child,.pa{flex:none}
@media (max-width:900px){
.navlinks,.navcta{display:none !important}
.menubtn{display:inline-flex !important}
.pvw{display:none !important}
.rthumb{display:block !important}
.rnum{display:none !important}
}
@media (max-width:600px){

.themebtn{width:44px !important;height:44px !important}

.row{padding:18px 0 !important}
.row:hover{padding-left:0 !important}
.accb{padding-left:0 !important}
.badge{width:104px !important;height:104px !important;right:10px !important;top:-28px !important}
.stage{border-radius:20px !important;min-height:560px !important}
section,header,footer{max-width:100vw}
.heroimg{width:auto !important;left:-20px !important;right:-20px !important;bottom:auto !important;height:72% !important}
.fadeL{background:linear-gradient(180deg,rgba(var(--bg-rgb),0.15) 0%,rgba(var(--bg-rgb),0.55) 60%,var(--bg) 100%) !important}
.fadeB{background:linear-gradient(180deg,var(--bg) 0%,rgba(var(--bg-rgb),0) 18%) !important}
.ba{aspect-ratio:4/5 !important;border-radius:20px !important}
.balbl{font-size:10px !important;letter-spacing:0.18em !important;bottom:14px !important;padding:7px 11px !important}
.ba-handle{width:52px !important;height:52px !important;margin:-26px 0 0 -26px !important}
}
@media (prefers-reduced-motion:reduce){
.line>span{animation:none;transform:none}
.fade{animation:none;opacity:1}
.spin,.prog,.swap,.kb,.drift,.mnav{animation:none}
.mi{animation:none;opacity:1;transform:none}
}

<section id="top" style="max-width: 1440px; margin: 0 auto; padding: clamp(24px, 4vw, 56px) clamp(20px, 3vw, 40px) 0">
<div class="herotop" style="position: relative; padding: clamp(24px, 5vw, 72px) 0 clamp(8px, 2vw, 24px)">
<div class="heroimg" aria-hidden="true" style="position: absolute; z-index: 0; top: calc(-1 * clamp(24px, 4vw, 56px)); right: calc(-1 * (max(0px, (100vw - 1440px) / 2) + clamp(20px, 3vw, 40px))); bottom: 0; left: 34%; overflow: hidden; pointer-events: none">
<img class="drift" src="assets/hero-living-detail.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 55%; mix-blend-mode: multiply; opacity: 0.92">
<div class="fadeL" style="position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 0%, rgba(var(--bg-rgb),0.85) 18%, rgba(var(--bg-rgb),0) 62%)"></div>
<div class="fadeB" style="position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 0%, rgba(var(--bg-rgb),0) 38%), linear-gradient(180deg, var(--bg) 0%, rgba(var(--bg-rgb),0) 14%)"></div>
</div>
<h1 class="w" style="position: relative; z-index: 1; margin: 0; font-weight: 400; font-size: clamp(48px, 9.6vw, 156px); line-height: 0.98; letter-spacing: -0.025em">
<span class="line"><span>Interiors</span></span>
<span class="line l2"><span>with a <em style="font-weight: 400; color: var(--teal)">pulse</em></span></span>
<span class="line l3"><span>of the sea.</span></span>
</h1>
<div class="fade" style="position: relative; z-index: 1; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin: clamp(24px, 3vw, 40px) 0 0">
<p style="margin: 0; max-width: 460px; font-size: 18px; font-weight: 300; line-height: 1.55; color: var(--muted)"><span class="w" style="font-style: italic; font-size: 24px; color: var(--ink)">Styling beautiful homes.</span><br>Shiri Shemer is an interior designer based in Estepona, working across Marbella, the Costa del Sol and abroad — refined, timeless interiors with warmth.</p>
<a class="pill" href="#work" style="background: rgba(var(--bg-rgb),0.75); backdrop-filter: blur(6px); display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 10px 0 26px; border-radius: 999px; border: 1.5px solid var(--ink); font-size: 12px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase">Explore the work
<span class="pa" style="display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: var(--fill); color: var(--on-fill)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
</div>
</div>

<div class="stage" style="margin-top: clamp(28px, 3.5vw, 48px); position: relative; border-radius: 28px; overflow: hidden; background-color: {{room.bg}}; color: {{room.fg}}; min-height: clamp(520px, 62vw, 760px); display: flex; flex-direction: column">
<div class="par" style="position: absolute; inset: -10% 0; pointer-events: none; overflow: hidden">
<sc-for list="{{roomStage}}" as="rs" hint-placeholder-count="1">
<img class="kb" src="{{rs.img}}" alt="{{rs.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
</sc-for>
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,46,58,0.35) 0%, rgba(11,46,58,0) 28%, rgba(11,46,58,0) 45%, rgba(11,46,58,0.78) 100%)"></div>
</div>
<div style="position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: clamp(20px, 3vw, 36px)">
<span style="font-size: 11px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; padding: 9px 16px; border-radius: 999px; background: rgba(253,252,220,0.16); backdrop-filter: blur(8px); border: 1px solid rgba(253,252,220,0.4)">Interiors by Shiri</span>
<span class="w" style="font-size: 20px; font-weight: 400; font-style: italic">{{room.num}} <span style="opacity: 0.5">/ 04</span></span>
</div>
<div style="position: relative; margin-top: auto; padding: clamp(20px, 3vw, 36px); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 28px">
<sc-for list="{{roomStage}}" as="rs" hint-placeholder-count="1">
<div class="swap" style="display: flex; flex-direction: column; gap: 10px; max-width: 560px">
<p class="w" style="margin: 0; font-size: clamp(48px, 7vw, 110px); font-weight: 400; font-style: italic; line-height: 0.95; letter-spacing: -0.02em">{{rs.name}}</p>
<p style="margin: 0; font-size: 17px; line-height: 1.5; opacity: 0.85">{{rs.line}}</p>
</div>
</sc-for>
<div style="display: flex; gap: 10px">
<button type="button" aria-label="Previous room" onClick="{{prevRoom}}" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<button type="button" aria-label="Next room" onClick="{{nextRoom}}" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
<div role="tablist" aria-label="Rooms" style="position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); border-top: 1px solid currentColor">
<sc-for list="{{rooms}}" as="r" hint-placeholder-count="4">
<sc-if value="{{r.active}}" hint-placeholder-val="{{false}}">
<button class="rtab" type="button" role="tab" aria-selected="true" onClick="{{r.pick}}" style="position: relative; text-align: left; min-height: 64px; padding: 16px clamp(20px, 3vw, 36px); background: transparent; color: inherit; border: 0; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">{{r.num}} — {{r.name}}<span class="prog"></span></button>
</sc-if>
<sc-if value="{{r.inactive}}" hint-placeholder-val="{{true}}">
<button class="rtab" type="button" role="tab" aria-selected="false" onClick="{{r.pick}}" style="position: relative; text-align: left; min-height: 64px; padding: 16px clamp(20px, 3vw, 36px); background: transparent; color: inherit; border: 0; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 500; opacity: 0.55; cursor: pointer">{{r.num}} — {{r.name}}</button>
</sc-if>
</sc-for>
</div>
</div>
</section>


<!-- BEFORE / AFTER -->
<section id="transform" style="max-width: 1440px; margin: 0 auto; padding: clamp(80px, 10vw, 150px) clamp(20px, 3vw, 40px) 0">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 40px">
<h2 class="w" style="margin: 0; font-weight: 400; font-size: clamp(40px, 6.4vw, 100px); line-height: 0.98; letter-spacing: -0.025em">Up close.<br><span style="font-style: italic; font-weight: 400; color: var(--teal)">Step back.</span></h2>
<p style="margin: 0; max-width: 380px; font-size: 17px; font-weight: 300; line-height: 1.55; color: var(--muted)">Every detail is chosen for the whole. Drag across the room to step back from the textures to the full space.</p>
</div>
<div class="ba rvimg" style="position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 28px; overflow: hidden; background: var(--soft); user-select: none">
<img src="assets/villa-living-close.jpg" alt="Living room detail: linen sofas, carved wooden table and terracotta poufs" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<img src="assets/villa-living-wide.jpg" alt="The same living room seen whole, with garden windows and fireplace wall" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; clip-path: inset(0 0 0 {{pos}}%)">
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: {{pos}}%; width: 2px; margin-left: -1px; background: var(--bg); pointer-events: none; z-index: 4">
<div class="ba-handle" style="position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.25)">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"></path></svg>
</div>
</div>
<label for="ba" class="sr">Compare close-up and wide view</label>
<input id="ba" class="ba-range" type="range" min="0" max="100" step="1" value="{{pos}}" onChange="{{setPos}}">
<div class="ba-focus" style="position: absolute; inset: 0; pointer-events: none; border-radius: 28px"></div>
<span style="position: absolute; left: 20px; bottom: 20px; z-index: 3; font-size: 12px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; background: var(--fill); color: var(--on-fill); padding: 8px 14px; border-radius: 999px; pointer-events: none" class="balbl">Up close</span>
<span style="position: absolute; right: 20px; bottom: 20px; z-index: 3; font-size: 12px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; background: var(--bg); color: var(--ink); padding: 8px 14px; border-radius: 999px; pointer-events: none" class="balbl">Whole room</span>
</div>
<p style="margin: 18px 0 0; font-size: 14px; color: var(--muted2)">Living room, private villa — Costa del Sol</p>
</section>

<!-- WORK INDEX with hover preview -->
<section id="work" style="max-width: 1440px; margin: 0 auto; padding: clamp(80px, 10vw, 150px) clamp(20px, 3vw, 40px)">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 40px">
<h2 class="w" style="margin: 0; font-weight: 400; font-size: clamp(40px, 6.4vw, 100px); line-height: 0.98; letter-spacing: -0.025em">Selected<br><span style="font-style: italic; font-weight: 400">work</span></h2>
<p style="margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted2)">Recent projects, 2024–2026</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
<ul style="list-style: none; margin: 0; padding: 0; flex: 999 1 560px; min-width: 0; border-top: 1.5px solid var(--ink)">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="6">
<li style="border-bottom: 1px solid rgba(var(--ink-rgb),0.18)">
<a class="row" href="#work" onMouseEnter="{{p.hover}}" onFocus="{{p.hover}}" style="display: flex; align-items: center; gap: clamp(12px, 2vw, 32px); padding: 26px 0; color: inherit">
<span class="w rnum" style="font-size: 18px; font-weight: 400; font-style: italic; min-width: 30px; opacity: 0.6">{{p.num}}</span>
<img class="rthumb" src="{{p.img}}" alt="" style="width: 72px; height: 72px; border-radius: 16px; object-fit: cover; flex: none">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span class="w" style="font-size: clamp(28px, 3.6vw, 52px); font-weight: 400; letter-spacing: -0.02em; line-height: 1">{{p.title}}</span>
<span style="font-size: 14px; color: var(--muted2)">{{p.place}}</span>
</span>
<span style="font-size: 13px; font-weight: 600; padding: 7px 14px; border: 1px solid rgba(var(--ink-rgb),0.25); border-radius: 999px; white-space: nowrap">{{p.cat}}</span>
<span class="ra rarrow" style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex: none; border-radius: 50%; border: 1px solid rgba(var(--ink-rgb),0.3)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>
</li>
</sc-for>
</ul>
<div class="pvw" style="flex: 1 1 380px; position: sticky; top: 100px">
<sc-for list="{{preview}}" as="pv" hint-placeholder-count="1">
<div class="swap" style="aspect-ratio: 4 / 5; border-radius: 24px; overflow: hidden; position: relative; background: #0B2E3A; color: #FDFCDC; display: flex; flex-direction: column; justify-content: space-between; padding: 28px">
<img class="card-img" src="{{pv.img}}" alt="{{pv.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,46,58,0) 50%, rgba(11,46,58,0.8) 100%)"></div>
<span style="position: relative; align-self: flex-start; font-size: 11px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; border-radius: 999px; padding: 8px 14px; background: {{pv.bg}}; color: {{pv.fg}}">{{pv.cat}}</span>
<div style="position: relative">
<p class="w" style="margin: 0; font-size: 38px; font-weight: 400; font-style: italic; letter-spacing: -0.02em; line-height: 1">{{pv.title}}</p>
<p style="margin: 8px 0 0; font-size: 14px; opacity: 0.9">{{pv.place}}</p>
</div>
</div>
</sc-for>
</div>
</div>
</section>

<!-- FIND YOUR STYLE -->
<section id="style" style="padding: 0 clamp(20px, 3vw, 40px)">
<div class="mood rvscale" style="max-width: 1440px; margin: 0 auto; border-radius: 28px; overflow: hidden; background-color: {{mood.bg}}; color: {{mood.fg}}; padding: clamp(40px, 6vw, 88px) clamp(24px, 5vw, 72px)">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 32px; margin-bottom: clamp(40px, 5vw, 72px)">
<div style="display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.8">Find your style</p>
<h2 class="w" style="margin: 0; font-weight: 400; font-size: clamp(40px, 6.4vw, 100px); line-height: 0.98; letter-spacing: -0.025em">What does<br><span style="font-style: italic; font-weight: 400">home</span> feel like?</h2>
</div>
<div role="radiogroup" aria-label="Choose a mood" style="display: flex; flex-wrap: wrap; gap: 10px; max-width: 520px">
<sc-for list="{{moods}}" as="m" hint-placeholder-count="4">
<sc-if value="{{m.active}}" hint-placeholder-val="{{false}}">
<button class="chip" type="button" role="radio" aria-checked="true" onClick="{{m.pick}}" style="min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1.5px solid currentColor; background: currentColor; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer"><span style="color: {{mood.bg}}">{{m.name}}</span></button>
</sc-if>
<sc-if value="{{m.inactive}}" hint-placeholder-val="{{true}}">
<button class="chip" type="button" role="radio" aria-checked="false" onClick="{{m.pick}}" style="min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1.5px solid currentColor; background: transparent; color: inherit; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer">{{m.name}}</button>
</sc-if>
</sc-for>
</div>
</div>
<sc-for list="{{moodStage}}" as="ms" hint-placeholder-count="1">
<div class="swap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: clamp(32px, 5vw, 72px); align-items: end">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: end">
<sc-for list="{{ms.swatches}}" as="s" hint-placeholder-count="4">
<div class="sw" style="display: flex; flex-direction: column; gap: 10px">
<div style="height: {{s.h}}px; border-radius: 999px 999px 16px 16px; background: {{s.c}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08)"></div>
<span style="font-size: 12px; font-weight: 600; opacity: 0.85">{{s.label}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 22px">
<p style="margin: 0; font-size: clamp(20px, 2vw, 26px); line-height: 1.4">{{ms.desc}}</p>
<p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; opacity: 0.8">Materials — {{ms.materials}}</p>
<a class="pill" href="#brief" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 10px 0 26px; border-radius: 999px; background: {{ms.fg}}; color: {{ms.bg}}; font-size: 12px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase">Start with {{ms.name}}
<span class="pa" style="display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: {{ms.bg}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{ms.fg}}" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
</div>
</div>
</sc-for>
</div>
</section>

<!-- STUDIO -->
<section id="studio" style="max-width: 1440px; margin: 0 auto; padding: clamp(80px, 10vw, 150px) clamp(20px, 3vw, 40px)">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: clamp(40px, 6vw, 96px); align-items: center">
<div style="position: relative">
<div class="rvimg zwrap" style="aspect-ratio: 4 / 5; border-radius: 28px; overflow: hidden; background: var(--peach)">
<img src="assets/shiri-portrait.jpg" alt="Shiri Shemer, interior designer, with velvet fabric samples" style="width: 100%; height: 100%; object-fit: cover; object-position: 74% 40%; display: block">
</div>
<div class="badge" style="position: absolute; right: -16px; top: -36px; width: 150px; height: 150px" aria-hidden="true">
<svg class="spin" viewBox="0 0 200 200" style="width: 100%; height: 100%">
<defs><path id="circ" d="M100 100m-78 0a78 78 0 1 1 156 0a78 78 0 1 1-156 0"></path></defs>
<circle cx="100" cy="100" r="100" fill="#F07167"></circle>
<text fill="#0B2E3A" style="font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 500; letter-spacing: 5px"><textPath href="#circ">ESTEPONA · MARBELLA · COSTA DEL SOL · </textPath></text>
</svg>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 28px">
<p style="margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--teal-text)">The studio</p>
<p class="w" style="margin: 0; font-weight: 400; font-size: clamp(30px, 3.6vw, 54px); line-height: 1.12; letter-spacing: -0.02em">I’m Shiri. I design homes that feel like a <span style="font-style: italic; font-weight: 400">deep breath</span> — calm, balanced and unmistakably yours.</p>
<p style="margin: 0; font-size: 17px; font-weight: 300; line-height: 1.7; color: var(--muted); max-width: 560px">Based in Estepona and working across Marbella and the Costa del Sol, I combine sophistication with warmth. Each project is a collaboration built on intuition and detail, inspired by Mediterranean light and lifestyle.</p>
<p style="margin: 0; font-size: 17px; font-weight: 300; line-height: 1.7; color: var(--muted); max-width: 560px">Life has taught me how much our homes shape the way we feel. That’s why I create calm, balanced sanctuaries — spaces that support you, every day.</p>
<a class="hl" href="#brief" style="align-self: flex-start; font-size: 16px; font-weight: 700">Work with Shiri →</a>
</div>
</div>
</section>

<!-- SERVICES accordion (dark) -->
<section id="services" style="background: #00708F; color: #FDFCDC; padding: clamp(80px, 10vw, 140px) 0">
<div style="max-width: 1440px; margin: 0 auto; padding: 0 clamp(20px, 3vw, 40px); display: flex; flex-wrap: wrap; gap: clamp(40px, 6vw, 96px)">
<div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 20px">
<h2 class="w" style="margin: 0; font-weight: 400; font-size: clamp(40px, 6.4vw, 100px); line-height: 0.98; letter-spacing: -0.025em">How we<br><span style="font-style: italic; font-weight: 400; color: #FED9B7">work</span></h2>
<p style="margin: 0; max-width: 360px; font-size: 17px; font-weight: 300; line-height: 1.6; color: #DDF1EE">From a single room to a whole residence, each commission is bespoke.</p>
</div>
<div style="flex: 999 1 560px; min-width: 0; border-top: 1px solid rgba(253,252,220,0.3)">
<sc-for list="{{services}}" as="s" hint-placeholder-count="4">
<div style="border-bottom: 1px solid rgba(253,252,220,0.3)">
<button class="acc" type="button" aria-expanded="{{s.expanded}}" onClick="{{s.toggle}}" style="width: 100%; display: flex; align-items: center; gap: 24px; padding: 28px 0; background: transparent; border: 0; color: #FDFCDC; cursor: pointer; text-align: left; font-family: 'Jost', sans-serif">
<span class="w" style="font-size: 18px; font-weight: 400; font-style: italic; color: #FDFCDC; min-width: 30px">{{s.num}}</span>
<span class="w" style="flex: 1; font-size: clamp(28px, 3.4vw, 48px); font-weight: 400; letter-spacing: -0.02em">{{s.title}}</span>
<span style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(253,252,220,0.45); font-size: 22px; font-weight: 300">{{s.sign}}</span>
</button>
<sc-if value="{{s.open}}" hint-placeholder-val="{{false}}">
<div class="swap accb" style="padding: 0 0 32px 54px; display: flex; flex-wrap: wrap; gap: 24px 48px">
<p style="margin: 0; flex: 1 1 320px; font-size: 17px; font-weight: 300; line-height: 1.65; color: #F2F7EE">{{s.body}}</p>
<p style="margin: 0; flex: 1 1 200px; font-size: 14px; line-height: 1.9; color: #DDF1EE">{{s.includes}}</p>
</div>
</sc-if>
</div>
</sc-for>
</div>
</div>
</section>

<!-- CLIENTS around the world -->
<section id="clients" style="background: var(--peach); padding: clamp(80px, 10vw, 140px) 0">
<div style="max-width: 1440px; margin: 0 auto; padding: 0 clamp(20px, 3vw, 40px); display: flex; flex-wrap: wrap; gap: clamp(40px, 6vw, 96px); align-items: flex-start">
<div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 22px">
