<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Brine Club social card</title>
<style>
@font-face{font-family:"DM Sans";font-style:normal;font-weight:400 700;font-display:block;src:url("fonts/dm-sans-latin.woff2") format("woff2")}
@font-face{font-family:"DM Mono";font-style:normal;font-weight:500;font-display:block;src:url("fonts/dm-mono-500-latin.woff2") format("woff2")}
@font-face{font-family:"Rye";font-style:normal;font-weight:400;font-display:block;src:url("fonts/rye-latin.woff2") format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#ed302d}
.card{
  width:1200px;height:630px;position:relative;overflow:hidden;
  background:#ed302d;color:#171312;
  font-family:"DM Sans",sans-serif;
}
.card:before{
  content:"";position:absolute;right:-40px;top:40px;width:560px;height:560px;border-radius:50%;
  background:#f5e9d5;opacity:.22;
}
.copy{position:relative;z-index:2;height:100%;padding:52px 56px 48px;display:flex;flex-direction:column}
.brand{display:flex;align-items:flex-end;gap:16px}
.logo{font:54px/0.82 "Rye",Georgia,serif;letter-spacing:-.06em;transform:rotate(-4deg);transform-origin:left center}
.by{font:15px "DM Mono",monospace;letter-spacing:.16em;text-transform:uppercase;padding-bottom:6px}
.by b{font-weight:500;color:#bd1825}
h1{margin-top:28px;font:78px/0.9 "Rye",Georgia,serif;letter-spacing:-.045em;max-width:760px}
h1 em{font-style:normal;color:#f5e9d5;text-shadow:3px 3px 0 #171312}
.where{margin-top:18px;font:20px "DM Mono",monospace;letter-spacing:.18em;text-transform:uppercase}
.foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:28px;max-width:760px}
.price{display:flex;align-items:flex-end;gap:10px}
.price strong{font:108px/0.8 "Rye",Georgia,serif;letter-spacing:-.05em}
.price span{font:22px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;padding-bottom:10px}
.ask{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.cta{
  display:inline-flex;align-items:center;gap:14px;
  background:#171312;color:#f5e9d5;border-radius:999px;
  padding:16px 22px;font:18px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;
}
.cta svg{display:block}
.url{font:20px "DM Mono",monospace;letter-spacing:.02em}
.jar{
  position:absolute;z-index:1;right:8px;top:18px;width:430px;height:594px;
  display:flex;align-items:flex-end;justify-content:center;
}
.jar img{width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(16px 18px 0 #17131233)}
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <div class="brand">
      <div class="logo">BRINE<br>CLUB®</div>
      <div class="by">By <b>Wellyington</b></div>
    </div>
    <h1>A landing page<br><em>designed &amp; built</em><br>for your business.</h1>
    <p class="where">UK &amp; Europe</p>
    <div class="foot">
      <div class="price"><strong>€99</strong><span>/ page</span></div>
      <div class="ask">
        <div class="cta">Get on the menu
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 14 L14 4 M7 4 H14 V11" fill="none" stroke="#f5e9d5" stroke-width="1.8"/></svg>
        </div>
        <div class="url">wellyington.github.io/brineclub</div>
      </div>
    </div>
  </div>
  <div class="jar"><img src="brine-club-jar-960.webp" alt=""></div>
</div>
</body>
</html>
