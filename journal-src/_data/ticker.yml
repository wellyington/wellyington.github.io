# Header ticker. Clocks tick live; "now" items are per language.
clocks:
  - { city: Estepona, tz: Europe/Madrid,    abbr: CET, home: true }
  - { city: London,   tz: Europe/London,    abbr: GMT }
  - { city: New York, tz: America/New_York, abbr: ET }
  - { city: Dubai,    tz: Asia/Dubai,       abbr: GST }

